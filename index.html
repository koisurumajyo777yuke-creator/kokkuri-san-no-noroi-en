document.getElementById("startButton").addEventListener("click", (event) => {

  storyScreen.classList.add("active");

});

function showScene() {

  const scene = scenes[currentScene];

  storyImage.src = scene.image;

  storyText.textContent = scene.text;
storyText.style.color = "";

storyText.classList.remove("shake");
  if (scene.chime) {

    schoolChime.currentTime = 0;

    schoolChime.play().catch(() => {});
}
  if (scene.coinSound) {

    coinSlideSound.currentTime = 0;

    coinSlideSound.play().catch(() => {});

}
  if (scene.waterDrop) {

    waterDropSound.currentTime = 0;

    waterDropSound.play().catch(() => {});

}

}

}

  scienceScrapeSound.currentTime = 0;

  scienceScrapeSound.play().catch(() => {});
}

    boneClickSound.currentTime = 0;

        boneClickSound.play().catch(() => {});

}
  if (scene.pianoSound) {

    pianoSound.currentTime = 0;
